<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>PRISM - Lesson</title>
		<link rel="stylesheet" href="Styles/main.css" />
		<link rel="stylesheet" href="Styles/lesson.css" />
	</head>
	<nav class="topbar">
		<ul>
			<li>
				<a href="index.html">
					<img src="Assets/prism2.png" alt="PrismLogo" />
				</a>
			</li>
			<li>
				<a
					href="index.html"
					onclick="
						return confirm(
							'Leaving will reset unsaved lesson progress. Are you sure?',
						);
					"
					>Home</a
				>
			</li>
			<li>
				<a
					href="profile.html"
					onclick="
						return confirm(
							'Leaving will reset unsaved lesson progress. Are you sure?',
						);
					"
					>Profile</a
				>
			</li>
			<li>
				<a
					href="dashboard.html"
					onclick="
						return confirm(
							'Leaving will reset unsaved lesson progress. Are you sure?',
						);
					"
					>Dashboard</a
				>
			</li>
		</ul>
	</nav>

	<body class="lesson-body">
		<div class="lesson-content">
			<div class="lesson-card">
				<h1 class="lesson-title">Loading...</h1>
				<p id="best-score">Best Score: N/A</p>
				<p id="current-score">Current Score: 0</p>

				<h2 class="lesson-question" id="lesson-question">Loading...</h2>
				<h3 class="result-message" id="result-message"></h3>

				<p id="question-source"></p>

				<div class="lesson-answers" id="lesson-answers">
					<button class="answer-button">Loading...</button>
					<button class="answer-button">Loading...</button>
					<button class="answer-button">Loading...</button>
					<button class="answer-button">Loading...</button>
				</div>
				<div class="lesson-navigation">
					<button class="nav-button" id="nav-button">Next</button>
					<button
						class="exit-button"
						id="exit-button"
						onclick="window.location.href = 'category.html'"
					>
						Exit Lesson
					</button>
				</div>
			</div>
		</div>
		<script type="module" src="javascript/lesson.js"></script>
		<script type="module" src="javascript/auth.js"></script>
	</body>
</html>
